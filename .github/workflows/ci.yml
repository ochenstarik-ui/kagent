name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/gateway
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff pytest
      - run: ruff check services/ scripts/ tests/unit/ --select E --ignore E501,E402
      - name: Run measurability unit tests
        run: >-
          python -m pytest
          tests/unit/test_measurability.py
          tests/unit/test_eval_suite.py
          tests/unit/test_drift_check.py
          tests/unit/test_roadmap_guard.py
      - run: python scripts/validate_repository.py
      - run: python scripts/drift_check.py

  measurability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify generated roadmap
        run: python scripts/roadmap_status.py --check --no-run-commands
      - name: Validate draft eval contracts in provider-free replay mode
        run: python scripts/eval_suite.py --replay
      - name: Upload computed roadmap
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: computed-roadmap
          path: docs/ROADMAP.md
