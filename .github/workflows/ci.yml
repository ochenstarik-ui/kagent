name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    outputs:
      commands: ${{ steps.command_evidence.outputs.commands }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - id: typecheck
        run: pnpm typecheck
      - id: unit_tests
        run: pnpm test
      - id: build
        run: pnpm build
      - name: Publish executed command set
        id: command_evidence
        if: ${{ always() }}
        run: >-
          echo 'commands={"pnpm typecheck":"${{ steps.typecheck.outcome }}","pnpm test":"${{ steps.unit_tests.outcome }}","pnpm build":"${{ steps.build.outcome }}"}' >> "$GITHUB_OUTPUT"

  rust:
    runs-on: ubuntu-latest
    outputs:
      commands: ${{ steps.command_evidence.outputs.commands }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - id: rust_fmt
        run: cargo fmt --manifest-path services/gateway/Cargo.toml --check
      - id: rust_clippy
        run: cargo clippy --manifest-path services/gateway/Cargo.toml --all-targets -- -D warnings
      - id: rust_tests
        run: cargo test --manifest-path services/gateway/Cargo.toml
      - name: Publish executed command set
        id: command_evidence
        if: ${{ always() }}
        run: >-
          echo 'commands={"cargo fmt --manifest-path services/gateway/Cargo.toml --check":"${{ steps.rust_fmt.outcome }}","cargo clippy --manifest-path services/gateway/Cargo.toml --all-targets -- -D warnings":"${{ steps.rust_clippy.outcome }}","cargo test --manifest-path services/gateway/Cargo.toml":"${{ steps.rust_tests.outcome }}"}' >> "$GITHUB_OUTPUT"

  python:
    runs-on: ubuntu-latest
    outputs:
      commands: ${{ steps.command_evidence.outputs.commands }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r services/pipeline/requirements.txt ruff pytest pytest-asyncio
      - run: ruff check services scripts tests
      - name: Run unit tests
        run: >-
          python -m pytest
          tests/unit
          services/reasoning-engine/tests/unit
          services/pipeline/tests/unit
      - id: repo_validation
        run: python scripts/validate_repository.py
      - id: drift_check
        run: python scripts/drift_check.py
      - name: Publish executed command set
        id: command_evidence
        if: ${{ always() }}
        run: >-
          echo 'commands={"python scripts/validate_repository.py":"${{ steps.repo_validation.outcome }}","python scripts/drift_check.py":"${{ steps.drift_check.outcome }}"}' >> "$GITHUB_OUTPUT"

  eval:
    runs-on: ubuntu-latest
    outputs:
      commands: ${{ steps.command_evidence.outputs.commands }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - id: eval_replay
        run: python scripts/eval_suite.py --replay
      - name: Publish executed command set
        id: command_evidence
        if: ${{ always() }}
        run: >-
          echo 'commands={"python scripts/eval_suite.py --replay":"${{ steps.eval_replay.outcome }}"}' >> "$GITHUB_OUTPUT"

  image-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: gateway
            dockerfile: services/gateway/Dockerfile
          - service: control-plane
            dockerfile: services/control-plane/Dockerfile
          - service: reasoning-engine
            dockerfile: services/reasoning-engine/Dockerfile
          - service: agent-runtime
            dockerfile: services/agent_runtime/Dockerfile
          - service: pipeline
            dockerfile: services/pipeline/Dockerfile
          - service: observability
            dockerfile: services/observability/Dockerfile
          - service: web
            dockerfile: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  measurability:
    needs: [node, rust, python, eval, image-build, nats-events, integration]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Collect CI results
        env:
          CI_JOB_RESULTS: ${{ toJSON(needs) }}
          CI_RUN_ID: ${{ github.run_id }}
          CI_COMMIT: ${{ github.sha }}
          CI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CI_EVENT: ${{ github.event_name }}
          CI_REF: ${{ github.ref }}
        run: >-
          python scripts/ci_results.py
          --needs-json "$CI_JOB_RESULTS"
          --run-id "$CI_RUN_ID"
          --commit "$CI_COMMIT"
          --run-url "$CI_RUN_URL"
          --event "$CI_EVENT"
          --ref "$CI_REF"
          --output ci-results.json
      - name: Guard committed roadmap
        run: python scripts/roadmap_status.py --check --no-run-commands
      - name: Generate evidence-backed roadmap
        run: >-
          python scripts/roadmap_status.py
          --ci-results ci-results.json
          --no-run-commands
      - name: Upload computed roadmap
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: computed-roadmap
          path: |
            docs/ROADMAP.md
            ci-results.json

  nats-events:
    runs-on: ubuntu-latest
    services:
      nats:
        image: nats:2.11-alpine
        command: --js --store_dir /data --http_port 8222
        ports:
          - 4223:4222
          - 8222:8222
        options: >-
          --health-cmd "wget -qO- http://127.0.0.1:8222/healthz"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install event test dependencies
        run: pip install -r services/pipeline/requirements.txt pytest pytest-asyncio
      - name: Verify JetStream event delivery
        env:
          NATS_URL: nats://127.0.0.1:4223
        run: python -m pytest tests/integration/test_nats_events.py -q

  integration:
    runs-on: ubuntu-latest
    outputs:
      commands: ${{ steps.command_evidence.outputs.commands }}
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: kagent
          POSTGRES_USER: kagent
          POSTGRES_PASSWORD: kagent
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply Database Migrations
        env:
          PGPASSWORD: kagent
        run: |
          set -e
          # Apply every migration in order. A named list silently skips new files:
          # 005_recovery_codes.sql was added by a task and never reached this step.
          for migration in $(ls migrations/*.sql | sort); do
            echo "applying $migration"
            psql -h localhost -U kagent -d kagent -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile=false
          pip install asyncpg pytest
      - name: Validate Compose configuration
        id: compose_config
        run: docker compose config -q
      - name: Run Control Plane Integration Tests
        env:
          DATABASE_URL: postgres://kagent:kagent@localhost:5432/kagent
        run: pnpm --filter @kagent/control-plane test
      - name: Run PostgreSQL Integration Tests
        id: integration_tests
        env:
          DATABASE_URL: postgres://kagent:kagent@localhost:5432/kagent
        run: python tests/integration/test_pg.py
      - name: Publish executed command set
        id: command_evidence
        if: ${{ always() }}
        run: >-
          echo 'commands={"docker compose config -q":"${{ steps.compose_config.outcome }}","python tests/integration/test_pg.py":"${{ steps.integration_tests.outcome }}"}' >> "$GITHUB_OUTPUT"

  publish-verification-status:
    needs: [node, rust, python, eval, image-build, nats-events, integration, measurability]
    if: >-
      ${{
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main' &&
        needs.node.result == 'success' &&
        needs.rust.result == 'success' &&
        needs.python.result == 'success' &&
        needs.eval.result == 'success' &&
        needs['image-build'].result == 'success' &&
        needs['nats-events'].result == 'success' &&
        needs.integration.result == 'success' &&
        needs.measurability.result == 'success'
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: computed-roadmap
          path: status-evidence
      - name: Publish verified status
        run: |
          set -euo pipefail
          state_ref="refs/heads/verification-state"
          observed_old_oid="$(git ls-remote --refs origin "$state_ref" | cut -f1)"
          cp status-evidence/ci-results.json docs/ci-results.json
          python scripts/roadmap_status.py --no-run-commands
          python scripts/roadmap_status.py --check --no-run-commands
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --detach
          git add docs/ci-results.json docs/ROADMAP.md
          git commit -m "Update verified capability status"
          git push \
            --force-with-lease="$state_ref:$observed_old_oid" \
            origin "HEAD:$state_ref"

