name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/gateway
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r services/pipeline/requirements.txt ruff pytest pytest-asyncio
      - run: ruff check services/ scripts/ tests/unit/ --select E --ignore E501,E402
      - name: Run measurability unit tests
        run: >-
          python -m pytest
          tests/unit/test_measurability.py
          tests/unit/test_eval_suite.py
          tests/unit/test_drift_check.py
          tests/unit/test_roadmap_guard.py
          tests/unit/test_event_streaming.py
          tests/unit/test_pipeline_events.py
      - run: python scripts/validate_repository.py
      - run: python scripts/drift_check.py

  measurability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify generated roadmap
        run: python scripts/roadmap_status.py --check --no-run-commands
      - name: Validate draft eval contracts in provider-free replay mode
        run: python scripts/eval_suite.py --replay
      - name: Upload computed roadmap
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: computed-roadmap
          path: docs/ROADMAP.md

  nats-events:
    runs-on: ubuntu-latest
    services:
      nats:
        image: nats:2.11-alpine
        command: --js --store_dir /data --http_port 8222
        ports:
          - 4223:4222
          - 8222:8222
        options: >-
          --health-cmd "wget -qO- http://127.0.0.1:8222/healthz"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install event test dependencies
        run: pip install -r services/pipeline/requirements.txt pytest pytest-asyncio
      - name: Verify JetStream event delivery
        env:
          NATS_URL: nats://127.0.0.1:4223
        run: python -m pytest tests/integration/test_nats_events.py -q

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: kagent
          POSTGRES_USER: kagent
          POSTGRES_PASSWORD: kagent
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply Database Migrations
        env:
          PGPASSWORD: kagent
        run: |
          psql -h localhost -U kagent -d kagent -f migrations/001_initial_schema.sql
          psql -h localhost -U kagent -d kagent -f migrations/002_auth.sql
          psql -h localhost -U kagent -d kagent -f migrations/003_audit_immutability.sql
      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile=false
          pip install asyncpg pytest
      - name: Run Integration Tests
        env:
          DATABASE_URL: postgres://kagent:kagent@localhost:5432/kagent
        run: |
          pnpm --filter @kagent/control-plane test
          python tests/integration/test_pg.py

