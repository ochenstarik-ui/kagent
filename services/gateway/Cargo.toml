[package]
name = "kagent-gateway"
version = "0.2.0"
edition = "2024"
publish = false
license = "UNLICENSED"

[dependencies]
axum = "0.8.4"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread", "signal"] }
tower = "0.5.2"
tower-http = { version = "0.6.6", features = [
    "request-id", "trace", "cors", "limit",
    "set-header", "compression-gzip", "decompression-gzip", "catch-panic",
] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "json"] }
uuid = { version = "1.18.0", features = ["v4"] }
http-body-util = "0.1.3"

[target.'cfg(not(target_os = "windows"))'.dependencies]
reqwest = { version = "0.12.5", default-features = false, features = ["rustls-tls"] }

[target.'cfg(target_os = "windows")'.dependencies]
reqwest = { version = "0.12.5", default-features = false, features = ["native-tls"] }
