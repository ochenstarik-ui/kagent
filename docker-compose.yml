# KAgent infrastructure + all services
x-service-defaults: &service-defaults
  restart: unless-stopped
  init: true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  # ── Infrastructure ──────────────────────

  postgres:
    <<: *service-defaults
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kagent}
      POSTGRES_USER: ${POSTGRES_USER:-kagent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kagent}"]
      interval: 5s
      timeout: 3s
      retries: 20

  nats:
    <<: *service-defaults
    image: nats:2.11-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    <<: *service-defaults
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-kagent-local}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-change-me-locally}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── KAgent Services ─────────────────────

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    <<: *service-defaults
    ports:
      - "${GATEWAY_BIND_ADDRESS:-127.0.0.1}:${GATEWAY_PORT:-8080}:8080"
    environment:
      KAGENT_HTTP_HOST: "0.0.0.0"
      KAGENT_GATEWAY_PORT: "8080"
      CONTROL_PLANE_URL: "http://control-plane:8100"
      REASONING_ENGINE_URL: "http://reasoning-engine:8200"
      OBSERVABILITY_URL: "http://observability:8500"
      WEB_URL: "http://web:3000"
      KAGENT_SERVICE_SECRET: ${KAGENT_SERVICE_SECRET:-}
      GATEWAY_RATE_LIMIT_WINDOW_SECONDS: ${GATEWAY_RATE_LIMIT_WINDOW_SECONDS:-60}
      GATEWAY_RATE_LIMIT_MAX_REQUESTS: ${GATEWAY_RATE_LIMIT_MAX_REQUESTS:-120}
      RUST_LOG: ${RUST_LOG:-info}
    depends_on:
      control-plane:
        condition: service_healthy
      reasoning-engine:
        condition: service_healthy
      observability:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health/live"]
      interval: 10s
      timeout: 3s
      retries: 5

  control-plane:
    build:
      context: .
      dockerfile: services/control-plane/Dockerfile
    <<: *service-defaults
    environment:
      CONTROL_PLANE_PORT: "8100"
      CONTROL_PLANE_HOST: "0.0.0.0"
      DATABASE_URL: "postgres://${POSTGRES_USER:-kagent}:${POSTGRES_PASSWORD:-change-me-locally}@postgres:5432/${POSTGRES_DB:-kagent}"
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production-min-32-chars}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8100/health/live"]
      interval: 10s
      timeout: 3s
      retries: 5

  reasoning-engine:
    build:
      context: .
      dockerfile: services/reasoning-engine/Dockerfile
    <<: *service-defaults
    environment:
      KAGENT_SERVICE_SECRET: ${KAGENT_SERVICE_SECRET:-}
      OPENCODE_GO_ENDPOINT: ${OPENCODE_GO_ENDPOINT:-http://host.docker.internal:20127}
      OPENCODE_GO_API_KEY: ${OPENCODE_GO_API_KEY:-}
      OPENCODE_GO_1_API_KEY: ${OPENCODE_GO_1_API_KEY:-}
      OPENCODE_GO_2_API_KEY: ${OPENCODE_GO_2_API_KEY:-}
      OPENCODE_GO_3_API_KEY: ${OPENCODE_GO_3_API_KEY:-}
      OPENCODE_GO_4_API_KEY: ${OPENCODE_GO_4_API_KEY:-}
      OPENCODE_GO_5_API_KEY: ${OPENCODE_GO_5_API_KEY:-}
      OPENCODE_GO_6_API_KEY: ${OPENCODE_GO_6_API_KEY:-}
      OPENCODE_GO_7_API_KEY: ${OPENCODE_GO_7_API_KEY:-}
      OPENCODE_GO_8_API_KEY: ${OPENCODE_GO_8_API_KEY:-}
      OPENCODE_GO_9_API_KEY: ${OPENCODE_GO_9_API_KEY:-}
      XAI_ENDPOINT: ${XAI_ENDPOINT:-https://api.x.ai/v1}
      XAI_API_KEY: ${XAI_API_KEY:-}
      XAI_1_API_KEY: ${XAI_1_API_KEY:-}
      XAI_2_API_KEY: ${XAI_2_API_KEY:-}
      XAI_3_API_KEY: ${XAI_3_API_KEY:-}
      XAI_4_API_KEY: ${XAI_4_API_KEY:-}
      XAI_5_API_KEY: ${XAI_5_API_KEY:-}
      XAI_6_API_KEY: ${XAI_6_API_KEY:-}
      XAI_7_API_KEY: ${XAI_7_API_KEY:-}
      XAI_8_API_KEY: ${XAI_8_API_KEY:-}
      XAI_9_API_KEY: ${XAI_9_API_KEY:-}
      OPENAI_ENDPOINT: ${OPENAI_ENDPOINT:-https://api.openai.com/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_1_API_KEY: ${OPENAI_1_API_KEY:-}
      OPENAI_2_API_KEY: ${OPENAI_2_API_KEY:-}
      OPENAI_3_API_KEY: ${OPENAI_3_API_KEY:-}
      OPENAI_4_API_KEY: ${OPENAI_4_API_KEY:-}
      OPENAI_5_API_KEY: ${OPENAI_5_API_KEY:-}
      OPENAI_6_API_KEY: ${OPENAI_6_API_KEY:-}
      OPENAI_7_API_KEY: ${OPENAI_7_API_KEY:-}
      OPENAI_8_API_KEY: ${OPENAI_8_API_KEY:-}
      OPENAI_9_API_KEY: ${OPENAI_9_API_KEY:-}
      POOL_DEFAULT: ${POOL_DEFAULT:-}
      POOL_ORCHESTRATOR: ${POOL_ORCHESTRATOR:-}
      POOL_SUBAGENTS: ${POOL_SUBAGENTS:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8200/health/live')"]
      interval: 10s
      timeout: 3s
      retries: 5

  agent-runtime:
    build:
      context: .
      dockerfile: services/agent_runtime/Dockerfile
    <<: *service-defaults
    environment:
      KAGENT_SERVICE_SECRET: ${KAGENT_SERVICE_SECRET:-}
    volumes:
      - agent-workspaces:/tmp/kagent-workspaces
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8300/health/live')"]
      interval: 10s
      timeout: 3s
      retries: 5

  pipeline:
    build:
      context: .
      dockerfile: services/pipeline/Dockerfile
    <<: *service-defaults
    environment:
      RUNTIME_URL: "http://agent-runtime:8300"
      REASONING_URL: "http://reasoning-engine:8200"
      NATS_URL: "nats://nats:4222"
      KAGENT_SERVICE_SECRET: ${KAGENT_SERVICE_SECRET:-}
    depends_on:
      agent-runtime:
        condition: service_healthy
      reasoning-engine:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8400/health/live')"]
      interval: 10s
      timeout: 3s
      retries: 5

  observability:
    build:
      context: .
      dockerfile: services/observability/Dockerfile
    <<: *service-defaults
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8500/health/live')"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    <<: *service-defaults
    environment:
      GATEWAY_URL: "http://gateway:8080"
      PORT: "3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  nats-data:
  minio-data:
  agent-workspaces:
